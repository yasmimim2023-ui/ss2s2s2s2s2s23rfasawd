name: Build APKs
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: ./gradlew assembleControllerDebug assembleReceiverDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ThorLink-APKs
          path: |
            app/build/outputs/apk/controller/debug/*.apk
            app/build/outputs/apk/receiver/debug/*.apk
